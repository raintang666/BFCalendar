name: calendarview_flutter
description: A customizable Flutter calendar view with single selection, range selection, multi-selection, year view, and pluggable calendar cell builders.
version: 0.3.0
homepage: https://github.com/raintang666/BFCalendar
repository: https://github.com/raintang666/BFCalendar
issue_tracker: https://github.com/raintang666/BFCalendar/issues
topics:
  - calendar
  - flutter
  - date-picker
  - calendar-view
screenshots:
  - description: Spring Festival lanterns in the Holiday Lights calendar demo.
    path: screenshots/holiday_spring_festival.gif
  - description: New Year's Eve fireworks in the Holiday Lights calendar demo.
    path: screenshots/holiday_new_years_eve.gif
  - description: Christmas snowfall in the Holiday Lights calendar demo.
    path: screenshots/holiday_christmas.gif

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: '>=1.0.8 <3.0.0'
  lunar: ^1.7.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/fonts/holiday_calendar/OFL-HostGrotesk.txt
    - assets/fonts/holiday_calendar/OFL-Geist.txt
  fonts:
    - family: HolidayHostGrotesk
      fonts:
        - asset: assets/fonts/holiday_calendar/HostGrotesk-Variable.ttf
    - family: HolidayGeistMono
      fonts:
        - asset: assets/fonts/holiday_calendar/GeistMono-Variable.ttf
