<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07080a">
  <meta name="description" content="在玻璃月历里预览中国节日与节气的 Canvas 动效。">
  <title>节日光影 · 玻璃日历</title>
  <link rel="icon" href="data:,">
  <link rel="preload" href="fonts/HostGrotesk-Variable.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="fonts/GeistMono-Variable.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="style.css?v=festival-icons">
</head>
<body data-view="festival">
  <header class="masthead">
    <a class="wordmark" href="#yuandan"><span class="brand-mark" aria-hidden="true">◌</span> 节日光影</a>
    <span class="edition"><span id="edition-kind">CHINESE FESTIVALS</span> <span aria-hidden="true">／</span> <b id="edition-year">2027</b></span>
    <nav class="view-switch" aria-label="日历视图">
      <a href="#yuandan" data-view="festival" aria-current="true">中国节日</a>
      <a href="#qingming" data-view="solar">节气</a>
    </nav>
  </header>
  <main>
    <section class="workspace" aria-label="玻璃日历">
      <div class="stage" id="stage">
        <canvas id="light" width="540" height="540" aria-hidden="true"></canvas>
        <article class="card" id="card" aria-label="交互式月历">
          <canvas id="scene" width="1168" height="880" aria-hidden="true"></canvas>
          <p id="month-label" class="month-label">2027 年 1 月</p>
          <div class="month-nav">
            <button id="prev" aria-label="上个月"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m10 3-5 5 5 5"/></svg></button>
            <button id="next" aria-label="下个月"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m6 3 5 5-5 5"/></svg></button>
          </div>
          <div class="label" id="label" aria-live="polite">
            <p id="eyebrow">2027.01.01 · 周五</p>
            <h1 id="title">元旦</h1>
            <p class="scene-caption" id="caption">烟花升起，新的一年开始。</p>
          </div>
          <div class="weekdays" aria-hidden="true"><span>MON</span><span>TUE</span><span>WED</span><span>THU</span><span>FRI</span><span>SAT</span><span>SUN</span></div>
          <div class="pill" id="pill" aria-hidden="true"></div>
          <div class="grid" id="grid" role="group" aria-label="月历"></div>
          <canvas id="overlay" width="1168" height="1296" aria-hidden="true"></canvas>
          <div class="edge" id="edge" aria-hidden="true"></div>
        </article>
      </div>
      <div class="scene-index" aria-hidden="true"><span id="scene-number">01</span><i></i><span id="scene-count"></span></div>
      <div class="scene-note" id="scene-note"></div>
    </section>
    <section class="control-dock" aria-label="效果控制">
      <div class="terms" id="choices" role="group" aria-label="选择节日"></div>
      <div class="playback">
        <button id="play" aria-label="暂停动效" aria-pressed="false"><svg viewBox="0 0 20 20" aria-hidden="true"><path id="play-icon" d="M7 5v10M13 5v10"/></svg><span id="play-label">暂停</span></button>
        <button id="restart" aria-label="重新播放"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 7a6 6 0 1 1-1 5M5 3v4h4"/></svg><span>重播</span></button>
        <label class="time-control"><span class="sr-only">动画时间</span><input id="timeline" type="range" min="0" max="13" step=".01" value="0"><output id="time">00.0</output></label>
        <span class="loop-label">13 SEC LOOP</span>
      </div>
    </section>
  </main>
  <footer id="calendar-note">2027 年节日日期</footer>
  <script type="module" src="app.js?v=festival-icons"></script>
</body>
</html>
